    <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>

    <!-- سكربتات أدسترا العامة -->
    <script src="https://pl31338684.profitableratecpmnetwork.com/e5/2b/83/e52b834151062d758ebcf6dfdbe3a259.js"></script>
    <script src="https://pl31340112.profitableratecpmnetwork.com/26/e7/9a/26e79a0cdde44c5762892f35680041cf.js"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <!-- 1. إعلان فوق (يظهر على الموبايل فقط lg:hidden، ومخفي على الكمبيوتر) -->
    <div class="lg:hidden w-full max-w-md mx-auto mb-4 flex flex-col items-center justify-center bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-center">
        <span class="text-[10px] text-slate-500 mb-1">إعلان</span>
        <div id="container-6f20a236765f1e892e66ce3e4c0974ff"></div>
        <script async="async" data-cfasync="false" src="https://pl31338685.profitableratecpmnetwork.com/6f20a236765f1e892e66ce3e4c0974ff/invoke.js"></script>
    </div>

    <!-- الحاوية الرئيسية (3 أعمدة في الديسكتوب: شمال - نص - يمين) -->
    <div class="w-full max-w-6xl flex flex-col lg:flex-row items-center lg:items-start justify-center gap-6">
        
        <!-- إعلان الجانب الأيسر (يظهر على الديسكتوب فقط hidden lg:flex) -->
        <div class="hidden lg:flex flex-col items-center justify-center w-[160px] min-h-[600px] bg-slate-900/40 border border-slate-800 rounded-xl p-2 shrink-0">
            <span class="text-[10px] text-slate-500 mb-2">إعلان</span>
            <div id="container-left-desktop"></div>
        </div>

        <!-- واجهة الإدخال الرئيسية (الكارت في النص) -->
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
            <!-- اللوجو -->
            <div class="flex justify-center mb-4">
                <img src="fazlakaa.jpg" alt="شعار فذلكة" class="w-20 h-20 object-contain">
            </div>

            <h1 class="text-2xl font-black mb-2 text-amber-400">بوابة التخصصات الكارثية</h1>
            <p class="text-slate-400 text-sm mb-6">سجل بياناتك واختر كليتك لاستخراج وثيقة الاعتماد الرسمية!</p>
            
            <!-- خانة اختيار الكلية -->
            <div class="mb-4 text-right">
                <label class="block text-xs text-slate-400 mb-1">اختر الكلية التابع لها:</label>
                <select id="college-select" 
                    class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold focus:outline-none focus:border-amber-400 transition appearance-none cursor-pointer">
                    <option value="habad">🧠 كلية الهبد المتقدم</option>
                    <option value="salkan">🤍 كلية السلكان الصافي</option>
                </select>
            </div>

            <!-- خانة إدخال الاسم -->
            <div class="mb-6 text-right">
                <label class="block text-xs text-slate-400 mb-1">اسم المواطن / الخريج:</label>
                <input type="text" id="username" placeholder="اكتب اسمك الثلاثي هنا..." 
                    class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white text-center font-bold focus:outline-none focus:border-amber-400 transition">
            </div>

            <!-- زر الانتقال وإصدار الشهادة -->
            <button onclick="goToCertificate()" 
                class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-4 rounded-xl shadow-lg transition transform active:scale-95 text-base cursor-pointer">
                إصدار الشهادة الرسمية 🚀
            </button>
        </div>

        <!-- إعلان الجانب الأيمن (يظهر على الديسكتوب فقط hidden lg:flex) -->
        <div class="hidden lg:flex flex-col items-center justify-center w-[160px] min-h-[600px] bg-slate-900/40 border border-slate-800 rounded-xl p-2 shrink-0">
            <span class="text-[10px] text-slate-500 mb-2">إعلان</span>
            <div id="container-right-desktop"></div>
        </div>

    </div>

    <!-- 2. إعلان تحت (يظهر على الموبايل فقط lg:hidden، ومخفي على الكمبيوتر) -->
    <div class="lg:hidden w-full max-w-md mx-auto mt-4 flex flex-col items-center justify-center bg-slate-900/60 border border-slate-800 rounded-xl p-3 text-center">
        <span class="text-[10px] text-slate-500 mb-1">إعلان</span>
        <div id="container-mobile-bottom"></div>
    </div>

    <!-- تذييلة بسيطة -->
    <div class="mt-4 text-xs text-slate-500 text-center">
        جميع الحقوق محفوظة لوزارة الضحك والتسليك © 2026
    </div>

    <script>
        document.getElementById('meta-og-url').setAttribute('content', window.location.href);

        function goToCertificate() {
            const usernameEl = document.getElementById('username');
            const collegeEl = document.getElementById('college-select');

            if (!usernameEl || !collegeEl) {
                alert("تأكد أن خانة الاسم والكلية عندهم الـ id المضبوط!");
                return;
            }

            const nameInput = usernameEl.value.trim();
            const collegeSelect = collegeEl.value;
            
            if(!nameInput) {
                alert("يا فندم لازم تكتب اسمك الأول عشان نقدر نختم الشهادة!");
                usernameEl.focus();
                return;
            }

            window.location.href = `certificate.html?name=${encodeURIComponent(nameInput)}&college=${collegeSelect}`;
        }

        document.getElementById('username').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                goToCertificate();
            }
        });
    </script>
</body>
</html>
