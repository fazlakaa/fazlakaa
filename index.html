<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التخصصات الكارثية - جمهورية الهبد والسلكان 🎓</title>
    
    <!-- الأيقونة الخاصة بالمتصفح -->
    <link rel="icon" type="image/jpeg" href="fazlakaa.jpg">

    <!-- أكواد المعاينة لفيسبوك والسوشيال ميديا (Open Graph) -->
    <meta property="og:title" content="بوابة التخصصات الكارثية - جمهورية الهبد والسلكان" />
    <meta property="og:description" content="سجل بياناتك واختر كليتك لاستخراج وثيقة الاعتماد الرسمية ومعرفة تقديرك الحقيقي فوراً!" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:url" content="" id="meta-og-url" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <!-- واجهة الإدخال الرئيسية -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
        <!-- اللوجو -->
        <div class="flex justify-center mb-4">
            <img src="fazlakaa.jpg" alt="شعار فذلكة" class="w-20 h-20 object-contain">
        </div>

        <h1 class="text-2xl font-black mb-2 text-amber-400">بوابة التخصصات الكارثية</h1>
        <p class="text-slate-400 text-sm mb-6">سجل بياناتك واختر كليتك لاستخراج وثيقة الاعتماد الرسمية!</p>
        
        <!-- خانة اختيار الكلية -->
        <div class="mb-4 text-right">
            <label class="block text-xs text-slate-400 mb-1">اختر الكلية التابع لها:</label>
            <select id="college-select" 
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white font-bold focus:outline-none focus:border-amber-400 transition appearance-none cursor-pointer">
                <option value="habad">🧠 كلية الهبد المتقدم</option>
                <option value="salkan">🤍 كلية السلكان الصافي</option>
            </select>
        </div>

        <!-- خانة إدخال الاسم -->
        <div class="mb-6 text-right">
            <label class="block text-xs text-slate-400 mb-1">اسم المواطن / الخريج:</label>
            <input type="text" id="username" placeholder="اكتب اسمك الثلاثي هنا..." 
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white text-center font-bold focus:outline-none focus:border-amber-400 transition">
        </div>

        <!-- زر الانتقال وإصدار الشهادة -->
        <button onclick="goToCertificate()" 
            class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-4 rounded-xl shadow-lg transition transform active:scale-95 text-base cursor-pointer">
            إصدار الشهادة الرسمية 🚀
        </button>
    </div>

    <!-- مكان إعلان Adsterra اختياري في الصفحة الرئيسية -->
    <div class="mt-6 text-center text-xs text-slate-500">
        <!-- حط كود إعلان Adsterra هنا لو حبيت -->
    </div>

    <!-- تذييلة بسيطة -->
    <div class="mt-4 text-xs text-slate-500 text-center">
        جميع الحقوق محفوظة لوزارة الضحك والتسليك © 2026
    </div>

    <script>
        document.getElementById('meta-og-url').setAttribute('content', window.location.href);

        function goToCertificate() {
            const nameInput = document.getElementById('username').value.trim();
            const collegeSelect = document.getElementById('college-select++').value;
            
            if(!nameInput) {
                alert("يا فندم لازم تكتب اسمك الأول عشان نقدر نختم الشهادة!");
                document.getElementById('username').focus();
                return;
            }

            window.location.href = `certificate.html?name=${encodeURIComponent(nameInput)}&college=${collegeSelect}`;
        }

        document.getElementById('username').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                goToCertificate();
            }
        });
    </script>
</body>
</html>
