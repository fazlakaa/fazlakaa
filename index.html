<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة التخصصات الكارثية - جمهورية الهبد والسلكان 🎓</title>
    <meta name="google-site-verification" content="FUkPytKYcS7b7IXu68z5Gn6mHXprB-vj6nidJMqM2Lg" />
    <link rel="icon" type="image/jpeg" href="fazlakaa.jpg">
    
    <meta property="og:title" content="بوابة التخصصات الكارثية - جمهورية الهبد والسلكان" />
    <meta property="og:description" content="سجل اسمك واستخرج وثيقة الاعتماد الرسمية ومعرفة تقديرك الحقيقي فوراً!" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:url" content="" id="meta-og-url" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>

    <!-- السكربت العام -->
    <script src="https://pl31338684.profitableratecpmnetwork.com/e5/2b/83/e52b834151062d758ebcf6dfdbe3a259.js"></script>
</head>
<body class="bg-slate-950 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <!-- واجهة الإدخال الرئيسية (الكارت في النص) -->
    <div id="main-card" class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl text-center">
        <!-- اللوجو -->
        <div class="flex justify-center mb-4">
            <img src="fazlakaa.jpg" alt="شعار فذلكة" class="w-20 h-20 object-contain">
        </div>

        <h1 class="text-2xl font-black mb-2 text-amber-400">بوابة التخصصات الكارثية</h1>
        <p class="text-slate-400 text-sm mb-6">اكتب اسمك الثلاثي ودع القدر يحدد تخصصك في الجمهورية!</p>
        
        <!-- خانة إدخال الاسم -->
        <div class="mb-6 text-right">
            <label class="block text-xs text-slate-400 mb-1">اسم المواطن / الخريج:</label>
            <input type="text" id="username" placeholder="اكتب اسمك الثلاثي هنا..." 
                class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 text-white text-center font-bold focus:outline-none focus:border-amber-400 transition">
        </div>

        <!-- زر الانتقال وإصدار الشهادة -->
        <button onclick="goToCertificate()" 
            class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-black p-4 rounded-xl shadow-lg transition transform active:scale-95 text-base cursor-pointer">
            إصدار الشهادة الرسمية 🚀
        </button>
    </div>

    <!-- شاشة التحميل والتشويق (تظهر مؤقتاً عند الضغط) -->
    <div id="loading-box" class="max-w-md w-full bg-slate-900 border border-amber-500/40 p-8 rounded-3xl shadow-2xl text-center hidden">
        <div class="text-5xl mb-4 animate-bounce">🧪</div>
        <h3 id="loading-text" class="text-lg font-black text-amber-400 mb-2">جاري سحب عينة من الهبد في الدم...</h3>
        <p class="text-xs text-slate-400">يرجى الانتظار حتى تقوم اللجنة العليا بفحص الملف</p>
        <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden mt-6">
            <div id="loading-bar" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
        </div>
    </div>

    <!-- صندوق إعلان البانر تحت الكارت -->
    <div class="w-full max-w-md mx-auto mt-6 flex flex-col items-center justify-center bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-center">
        <span class="text-[10px] text-slate-500 mb-2">إعلان</span>
        <div id="container-6f20a236765f1e892e66ce3e4c0974ff"></div>
        <script async="async" data-cfasync="false" src="https://pl31338685.profitableratecpmnetwork.com/6f20a236765f1e892e66ce3e4c0974ff/invoke.js"></script>
    </div>

    <!-- تذييلة بسيطة -->
    <div class="mt-4 text-xs text-slate-500 text-center">
        جميع الحقوق محفوظة لوزارة الضحك والتسليك © 2026
    </div>

    <script>
        document.getElementById('meta-og-url').setAttribute('content', window.location.href);

        const funnyLoadingMessages = [
            "جاري سحب عينة من الهبد في الدم... 🧪",
            "جاري استشارة مجلس أبحاث الفتي... 🧐",
            "جاري مراجعة سجلات السلكان في الكنترول... 📑",
            "جاري ختم الشهادة بختم النسر المضروب... 🦅",
            "مبروك مقدماً يا فهلوي، الشهادة بتجهّز... 🎉"
        ];

        function goToCertificate() {
            const usernameEl = document.getElementById('username');
            if (!usernameEl) return;

            const nameInput = usernameEl.value.trim();
            
            if(!nameInput) {
                alert("يا فندم لازم تكتب اسمك الأول عشان نقدر نختم الشهادة!");
                usernameEl.focus();
                return;
            }

            document.getElementById('main-card').classList.add('hidden');
            document.getElementById('loading-box').classList.remove('hidden');

            const textEl = document.getElementById('loading-text');
            const barEl = document.getElementById('loading-bar');
            let step = 0;
            barEl.style.width = '20%';

            const interval = setInterval(() => {
                step++;
                if (step < funnyLoadingMessages.length) {
                    textEl.innerText = funnyLoadingMessages[step];
                    barEl.style.width = `${(step + 1) * 20}%`;
                }
            }, 550);

            setTimeout(() => {
                clearInterval(interval);
                window.location.href = `certificate.html?name=${encodeURIComponent(nameInput)}`;
            }, 2800);
        }

        document.getElementById('username').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                goToCertificate();
            }
        });
    </script>
</body>
</html>
