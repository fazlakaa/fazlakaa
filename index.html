<head>

    <meta property="og:title" content="بوابة فذلكة - جمهورية الهبد والسلكان" />

    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>

    <!-- السكربت العام للإعلانات -->
    <script src="https://pl31338684.profitableratecpmnetwork.com/e5/2b/83/e52b834151062d758ebcf6dfdbe3a259.js"></script>

    <script src="tools.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- الجزء العلوي: اللوجو والعنوان -->
    <div class="w-full max-w-4xl text-center my-6">
        <div class="flex justify-center mb-3">
            <img src="fazlakaa.jpg" alt="شعار فذلكة" class="w-20 h-20 object-contain rounded-2xl shadow-lg border border-slate-800">
        </div>
        <h1 class="text-3xl font-black text-amber-400 mb-2">جمهورية الهبد والسلكان</h1>
        <p class="text-slate-400 text-sm">اختر اللعبة أو الأداة التي تناسب كارثتك اليوم:</p>
    </div>

    <!-- شبكة الأدوات والألعاب (بتتولد أوتوماتيك من tools.js) -->
    <div id="tools-grid" class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-4 my-2">
        <!-- هنا الجافاسكريبت هيحط الكروت لوحده -->
    </div>

    <!-- صندوق إعلان البانر -->
    <div class="w-full max-w-md mx-auto my-6 flex flex-col items-center justify-center bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-center">
        <span class="text-[10px] text-slate-500 mb-2">إعلان</span>
        <div id="container-6f20a236765f1e892e66ce3e4c0974ff"></div>
        <script async="async" data-cfasync="false" src="https://pl31338685.profitableratecpmnetwork.com/6f20a236765f1e892e66ce3e4c0974ff/invoke.js"></script>
    </div>

    <!-- تذييلة بسيطة -->
    <div class="text-xs text-slate-500 text-center pb-2">
        جميع الحقوق محفوظة لوزارة الضحك والتسليك © 2026
    </div>

    <script>
        const gridContainer = document.getElementById('tools-grid');

        if (typeof myTools !== 'undefined') {
            myTools.forEach(tool => {
                const card = document.createElement('a');
                card.href = tool.link;
                card.className = "group bg-slate-900 hover:bg-slate-800/90 border border-slate-800 hover:border-amber-500/50 p-6 rounded-2xl shadow-xl transition-all duration-300 flex items-start gap-4 no-underline text-white transform hover:-translate-y-1 cursor-pointer";
                
                card.innerHTML = `
                    <div class="text-4xl bg-slate-800 p-3 rounded-xl border border-slate-700 group-hover:scale-110 transition-transform">
                        ${tool.icon}
                    </div>
                    <div class="flex-1 text-right">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="font-black text-lg text-amber-400 group-hover:text-amber-300">${tool.title}</h3>
                            ${tool.badge ? `<span class="bg-amber-500/20 text-amber-300 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-500/30">${tool.badge}</span>` : ''}
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed">${tool.desc}</p>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }
    </script>
</body>
</html>
